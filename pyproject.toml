[project]
name = "zoltraak"
version = "0.1.0"
description = "EV charging-aware route planner for India with H3 spatial indexing and OCM ingestion"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zoltraak Builders" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "h3>=4.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
